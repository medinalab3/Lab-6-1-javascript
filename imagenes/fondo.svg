<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Patrón de fondo: cuadrícula de puntos con símbolos de código -->
  <rect width="120" height="120" fill="#0d1117"/>
  <g fill="#10b981" fill-opacity="0.18">
    <circle cx="0" cy="0" r="1.5"/>
    <circle cx="120" cy="0" r="1.5"/>
    <circle cx="0" cy="120" r="1.5"/>
    <circle cx="120" cy="120" r="1.5"/>
    <circle cx="60" cy="60" r="1.5"/>
  </g>
  <g font-family="monospace" font-size="14" fill="#79c0ff" fill-opacity="0.08">
    <text x="18" y="38">{ }</text>
    <text x="78" y="98">&lt;/&gt;</text>
  </g>
</svg>
